[project]
name = "research-harness"
version = "0.1.0"
description = "Plugin-first research harness for Information Systems research"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "research-harness"}]
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pypdf>=5.0",
    "sympy>=1.14.0",
    "numpy>=2.5.2",
    "python-docx>=1.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.8",
    "pyright>=1.1",
    "httpx>=0.27",
]

[project.scripts]
research-agent = "research_harness.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: marks tests as live OpenRouter integration (requires OPENROUTER_API_KEY, run with `uv run --env-file .env pytest -m live`)",
    "live_literature: marks tests as live literature provider integration (run with `uv run --env-file .env pytest -m live_literature`)",
    "live_screening: marks tests as live screening integration (requires OPENROUTER_API_KEY, run with `uv run --env-file .env pytest -m live_screening`)",
    "live_documents: marks tests as live document tests (requires UNPAYWALL_EMAIL, run with `uv run --env-file .env pytest -m live_documents`)",
    "live_evidence: marks tests as live evidence extraction (requires OPENROUTER_API_KEY + prior FullTextCorpus, run with `uv run --env-file .env pytest -m live_evidence`)",
    "live_synthesis: marks tests as live synthesis (requires OPENROUTER_API_KEY + prior EvidenceCorpus, run with `uv run --env-file .env pytest -m live_synthesis`)",
    "live_gap_analysis: marks tests as live gap analysis (requires OPENROUTER_API_KEY + prior LiteratureSynthesis, run with `uv run --env-file .env pytest -m live_gap_analysis`)",
   "live_mechanism: marks tests as live mechanism development (requires OPENROUTER_API_KEY + prior GapAnalysis, run with `uv run --env-file .env pytest -m live_mechanism`)",
   "live_model_specification: marks tests as live formal model specification (requires OPENROUTER_API_KEY + prior SelectedMechanism, run with `uv run --env-file .env pytest -m live_model_specification`)",
   "live_equilibrium: marks tests as live equilibrium derivation (requires OPENROUTER_API_KEY + prior FormalAnalyticalModel, run with `uv run --env-file .env pytest -m live_equilibrium`)",
   "live_propositions: marks tests as live propositions (requires OPENROUTER_API_KEY + prior verified equilibrium, run with `uv run --env-file .env pytest -m live_propositions`)",
   "live_numerical_analysis: marks tests as live numerical analysis (requires a prior verified equilibrium; deterministic, no network, run with `uv run --env-file .env pytest -m live_numerical_analysis`)",
  "live_results_assembly: marks tests as live results assembly (requires OPENROUTER_API_KEY + a completed Phase 3 chain, run with `uv run --env-file .env pytest -m live_results_assembly`)",
  "live_manuscript: marks tests as live manuscript drafting (requires OPENROUTER_API_KEY + a results package, run with `uv run --env-file .env pytest -m live_manuscript`)",
  "live_publication: marks tests as live publication formatting (requires a manuscript draft; exports are deterministic, run with `uv run --env-file .env pytest -m live_publication`)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B027", "B017", "B904", "F841", "UP042", "UP046", "SIM102", "SIM105", "SIM108"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.8",
    "pyright>=1.1",
    "reportlab>=5.0.1",
]
