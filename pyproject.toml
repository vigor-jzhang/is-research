[project]
name = "research-harness"
version = "0.1.0"
description = "Plugin-first research harness for Information Systems research"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "research-harness"}]
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.8",
    "pyright>=1.1",
    "httpx>=0.27",
]

[project.scripts]
research-agent = "research_harness.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: marks tests as live OpenRouter integration (requires OPENROUTER_API_KEY, run with `uv run --env-file .env pytest -m live`)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B027", "B017", "B904", "F841"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.8",
    "pyright>=1.1",
]
