runtime:
  autonomy: high

plugins:
  - model.openrouter
  - routing.role_router
  - session.jsonl
  - autonomy.configurable
  - tool.echo
  - loop.simple_tool_loop

models:
  roles:
    fast:
      provider: openrouter
      model: "deepseek/deepseek-v4-flash-0731"

    reasoning:
      provider: openrouter
      model: "nvidia/nemotron-3-ultra-550b-a55b:free"

    critic:
      provider: openrouter
      model: "nvidia/nemotron-3-ultra-550b-a55b:free"

    long_context:
      provider: openrouter
      model: "deepseek/deepseek-v4-flash-0731"

session:
  root: ".research/sessions"

loop:
  max_steps: 8
