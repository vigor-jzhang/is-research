runtime:
  autonomy: high

plugins:
  - model.openrouter
  - routing.role_router
  - routing.policy_router
  - session.jsonl
  - storage.artifacts_sqlite
  - storage.blobs_filesystem
  - literature.crossref
  - literature.semantic_scholar
  - literature.ingestion
  - literature.identity_resolver
  - literature.search_planner
  - literature.search_orchestrator
  - literature.screening_protocol_builder
  - literature.screening_view_builder
  - literature.title_abstract_screener
  - literature.screening_orchestrator
  - literature.evidence_extractor
  - literature.evidence_orchestrator
  - literature.synthesis
  - literature.gap_analyzer
  - research.gap_selection
  - research.mechanism_generator
  - research.mechanism_critic
  - research.model_builder
  - research.model_specification_critic
  - research.equilibrium_deriver
  - research.equilibrium_verifier
  - research.comparative_statics
  - research.proposition_verifier
  - research.proposition_critic
  - research.proposition_generator
  - research.numerical_analysis
  - research.results_assembler
  - research.results_critic
  - research.manuscript_drafter
  - research.manuscript_critic
  - research.publication_formatter
  - research.novelty_validator
  - research.evaluation_harness
  - evaluation.model_tournament
  - evaluation.live_quality
  - evaluator.deterministic
  - evaluator.retrieval
  - evaluator.claim_grounding
  - evaluator.citation_correctness
  - evaluator.llm_judge
  - evaluator.screening
  - evaluator.evidence
  - evaluator.gap_analysis
  - evaluator.mechanism
  - evaluator.equilibrium
  - evaluator.numerical
  - evaluator.comparative_statics
  - evaluator.proposition
  - evaluator.results_grounding
  - evaluator.manuscript_grounding
  - evaluator.pipeline_integrity
  - evaluator.synthesis
  - evaluator.model_specification
  - evaluator.document_acquisition
  - evaluator.revalidation
  - evaluator.identity_resolution
  - evaluator.gap_selection
  - evaluator.novelty_revalidation
  - evaluator.publication_packaging
  - evaluator.evidence_enrichment
  - evaluator.model_routing
  - evaluator.live_quality_reasoning
  - evaluator.live_quality_critic
  - evaluator.live_quality_fast
  - evaluator.routing_readiness
  - evaluator.model_qualification
  - evaluator.task_model_qualification
  - documents.locator.metadata
  - documents.locator.unpaywall
  - documents.fetcher.http
  - documents.extractor.pypdf
  - documents.acquisition_orchestrator
  - autonomy.configurable
  - tool.echo
  - loop.simple_tool_loop

models:
  roles:
    fast:
      provider: openrouter
      model: "deepseek/deepseek-v4-flash-0731"

    reasoning:
      provider: openrouter
      model: "nvidia/nemotron-3-ultra-550b-a55b:free"

    critic:
      provider: openrouter
      model: "nvidia/nemotron-3-ultra-550b-a55b:free"

    long_context:
      provider: openrouter
      model: "deepseek/deepseek-v4-flash-0731"

session:
  root: ".research/sessions"

artifacts:
  store: sqlite
  path: ".research/artifacts.db"

literature:
  crossref:
    enabled: true
    timeout_seconds: 20
  semantic_scholar:
    enabled: true
    timeout_seconds: 20
  planning:
    model_role: fast
    max_queries: 8
    max_sources_per_query: 2
  orchestration:
    max_queries: 8
    max_results_per_query_per_source: 50
    max_total_provider_requests: 50
    max_total_papers: 500
  screening:
    protocol_model_role: reasoning
    screening_model_role: fast
    max_candidates: 500
    max_model_calls: 500
    max_inclusion_criteria: 12
    max_exclusion_criteria: 12
    review_uncertain: true
    review_low_confidence_below: 0.65
  evidence:
    model_role: reasoning
    pages_per_chunk: 4
    max_chunks_per_document: 50
    max_model_calls: 500
  synthesis:
    model_role: reasoning
    batch_profiles: 3
    max_evidence_per_profile: 12
    max_batches: 20
    max_model_calls: 100
  gap:
    model_role: reasoning
    max_statements: 200
    max_gaps: 50
    max_model_calls: 20

research:
  mechanism:
    generator_role: reasoning
    critic_role: critic
    revision_role: reasoning
    max_candidates: 5
    max_model_calls: 20
  model:
    builder_role: reasoning
    critic_role: critic
    revision_role: reasoning
    max_actors: 8
    max_variables: 40
    max_parameters: 40
    max_assumptions: 20
    max_stages: 20
    max_payoffs: 10
  equilibrium:
    deriver_role: reasoning
    revision_role: reasoning
    max_revisions: 2
    max_llm_calls: 10
  proposition:
    generator_role: reasoning
    critic_role: critic
    interpretation_role: reasoning
    max_propositions: 8
    max_llm_calls: 20
  numerical:
    model_role: reasoning
    max_points: 10000
    artifact_point_threshold: 500
  results:
    assembler_role: reasoning
    critic_role: critic
    max_findings: 12
    max_contributions: 8
    max_implications: 12
    max_llm_calls: 10
  manuscript:
    drafter_role: reasoning
    critic_role: critic
    max_llm_calls: 100
  publication:
    formatter_role: reasoning
    max_llm_calls: 10
  novelty:
    extractor_role: reasoning
    critic_role: critic
    max_llm_calls: 40
    max_queries_per_claim: 12
    queries_per_risk:
      critical: 10
      high: 6
      medium: 3
      low: 1
    max_results_per_query: 10
    providers: [semantic_scholar, crossref]
    search_year_window: 50
    require_all_searches_succeed: true
    require_candidate_evidence: true
    evidence_enrichment:
      enabled: true
      acquire_abstract: true
      acquire_full_text: true
      max_attempts_per_candidate: 3
      abstract_providers: [semantic_scholar, crossref]
    evidence_preacquisition:
      enabled: true
      risk_levels: [critical, high]
      max_candidates_per_claim: 10
      max_total_candidates: 30
      prefer_abstract: true
      acquire_full_text: false

documents:
  blob_root: ".research/blobs"
  location:
    use_metadata: true
    use_unpaywall: true
  download:
    timeout_seconds: 30
    max_redirects: 5
    max_bytes: 52428800
  acquisition:
    max_locations_per_paper: 5
  extraction:
    extractor: pypdf

evaluation:
  evaluators:
    - evaluator.deterministic
    - evaluator.claim_grounding
    - evaluator.citation_correctness
    - evaluator.llm_judge
  judge_role: critic
  cost_per_million_tokens:
    prompt: 0.0
    completion: 0.0

live_quality:
  repetitions: 3
  candidates:
    reasoning:
      - "nvidia/nemotron-3-ultra-550b-a55b:free"
      - "deepseek/deepseek-v4-flash-0731"
      - "meta-llama/llama-3.3-70b-instruct:free"
      - "mistralai/mistral-small-3.1-24b-instruct:free"
      - "google/gemini-2.5-flash:free"
      - "anthropic/claude-3.7-sonnet"
      - "openai/gpt-4o"
      - "google/gemini-2.5-pro"
    critic:
      - "nvidia/nemotron-3-ultra-550b-a55b:free"
      - "deepseek/deepseek-v4-flash-0731"
      - "meta-llama/llama-3.3-70b-instruct:free"
      - "mistralai/mistral-small-3.1-24b-instruct:free"
      - "anthropic/claude-3.7-sonnet"
      - "google/gemini-2.5-pro"
    fast:
      - "deepseek/deepseek-v4-flash-0731"
      - "nvidia/nemotron-3-ultra-550b-a55b:free"
      - "meta-llama/llama-3.3-70b-instruct:free"
      - "mistralai/mistral-small-3.1-24b-instruct:free"
      - "google/gemini-2.5-flash:free"
      - "openai/gpt-4o"

loop:
  max_steps: 8
